id: molsim
title: "Molecular Simulation Ontology"
description: "MOLSIM is a domain (application) ontology designed to semantically represent platform-agnostic biomolecular simulations (all-atom and coarse-grained) as FAIR (Findable, Accessible, Interoperable, and Reusable) datasets. As an application ontology, it reuses terms from established OBO ontologies where they fit and defines its own where they do not, aiming to standardize the representation of biomolecular simulation data, processes, and methodologies across platforms and tools."
contact:  f.musyaffa [at] fz-juelich [.] de
creators:
  - IBG-4, Forschungszentrum Jülich, Germany & Heinrich Heine University Dusseldorf, Germany
license: https://creativecommons.org/licenses/by/4.0/
github_org: CPCLab
repo: molsim-ontology
git_main_branch: main
allow_equivalents: all
release_artefacts: 
  - full
  - base
primary_release: full
export_formats:
  - owl
  - obo
  - json
import_group:
  products: 
    - id: ro
      module_type: filter  # Single Layer Module Extraction (STAR method)
      # We usually exclude individuals for RO to keep the file size down
      slme_individuals: exclude
      exclude_seeds: true
    - id: iao
      module_type: slme
#    - id: bfo
#      module_type: slme
    - id: omo
      module_type: slme
      description: "Standard OBO metadata elements (includes dc:creator, license, etc.)"
    - id: uo
      module_type: custom
    - id: so
      module_type: custom
#    - id: iao
#      module_type: custom       
    - id: chebi
      module_type: custom
#      annotate_defined_by: true
      mirror_type: no_mirror
      is_large: TRUE
      use_gzipped: TRUE
#    - id: ncit
#      module_type: custom
#      mirror_type: no_mirror
#      is_large: TRUE
#      use_gzipped: TRUE
#      annotate_defined_by: true
# redownload_after_hours: 168
components:
  products:
    - filename: molsim_units_component.owl      
reasoner: ELK
robot_java_args: '-Xmx8G'
